<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="620" viewBox="0 0 1800 620"><rect x="0" y="0" width="1800" height="620" fill="white" stroke="none" stroke-width="1.5" /><text x="40" y="52" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#25313a" text-anchor="start">Sentence-level evidence ranking in a retrieval-augmented news assistant</text><text x="40" y="87" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#58656f" text-anchor="start">From relevant news articles to evidence that supports an actor-specific human-value judgment.</text><rect x="752" y="251" width="326" height="247" fill="#eaf1f6" stroke="none" stroke-width="1.5" /><text x="915" y="280" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#35556b" text-anchor="middle">HVER-News evaluation scope</text><rect x="40" y="300" width="190" height="142" fill="white" stroke="#69757e" stroke-width="1.5" /><text x="135.0" y="335" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#25313a" text-anchor="middle">User question</text><text x="135.0" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#58656f" text-anchor="middle">Actor-specific</text><text x="135.0" y="404" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#58656f" text-anchor="middle">value judgment</text><rect x="270" y="300" width="210" height="142" fill="white" stroke="#69757e" stroke-width="1.5" /><text x="375.0" y="335" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#25313a" text-anchor="middle">LLM query</text><text x="375.0" y="362" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#25313a" text-anchor="middle">preparation</text><text x="375.0" y="397" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#58656f" text-anchor="middle">Interpret the question</text><text x="375.0" y="421" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#58656f" text-anchor="middle">Form a search request</text><rect x="520" y="300" width="210" height="142" fill="white" stroke="#69757e" stroke-width="1.5" /><text x="625.0" y="335" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#25313a" text-anchor="middle">News retrieval</text><text x="625.0" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#58656f" text-anchor="middle">Retrieve candidate</text><text x="625.0" y="404" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#58656f" text-anchor="middle">articles</text><rect x="770" y="300" width="290" height="142" fill="white" stroke="#69757e" stroke-width="1.5" /><text x="915.0" y="335" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#25313a" text-anchor="middle">Sentence-level</text><text x="915.0" y="362" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#25313a" text-anchor="middle">evidence ranking</text><text x="915.0" y="397" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#58656f" text-anchor="middle">Score query–sentence support</text><text x="915.0" y="421" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#58656f" text-anchor="middle">Prioritize supporting evidence</text><rect x="1100" y="300" width="180" height="142" fill="white" stroke="#69757e" stroke-width="1.5" /><text x="1190.0" y="335" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#25313a" text-anchor="middle">Evidence</text><text x="1190.0" y="362" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#25313a" text-anchor="middle">context</text><text x="1190.0" y="397" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#58656f" text-anchor="middle">Select top-ranked</text><text x="1190.0" y="421" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#58656f" text-anchor="middle">sentences</text><rect x="1320" y="300" width="210" height="142" fill="white" stroke="#69757e" stroke-width="1.5" /><text x="1425.0" y="335" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#25313a" text-anchor="middle">Augmented</text><text x="1425.0" y="362" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#25313a" text-anchor="middle">generation</text><text x="1425.0" y="397" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#58656f" text-anchor="middle">Question + evidence</text><text x="1425.0" y="421" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#58656f" text-anchor="middle">provided to the LLM</text><rect x="1570" y="300" width="190" height="142" fill="white" stroke="#69757e" stroke-width="1.5" /><text x="1665.0" y="335" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#25313a" text-anchor="middle">Answer to user</text><text x="1665.0" y="380" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#58656f" text-anchor="middle">Grounded response</text><text x="1665.0" y="404" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#58656f" text-anchor="middle">with citations</text><line x1="230" y1="371" x2="260" y2="371" stroke="#45535e" stroke-width="1.7" /><polyline points="252,366 260,371 252,376" fill="none" stroke="#45535e" stroke-width="1.7" /><line x1="480" y1="371" x2="510" y2="371" stroke="#45535e" stroke-width="1.7" /><polyline points="502,366 510,371 502,376" fill="none" stroke="#45535e" stroke-width="1.7" /><line x1="730" y1="371" x2="760" y2="371" stroke="#45535e" stroke-width="1.7" /><polyline points="752,366 760,371 752,376" fill="none" stroke="#45535e" stroke-width="1.7" /><line x1="1060" y1="371" x2="1090" y2="371" stroke="#45535e" stroke-width="1.7" /><polyline points="1082,366 1090,371 1082,376" fill="none" stroke="#45535e" stroke-width="1.7" /><line x1="1280" y1="371" x2="1310" y2="371" stroke="#45535e" stroke-width="1.7" /><polyline points="1302,366 1310,371 1302,376" fill="none" stroke="#45535e" stroke-width="1.7" /><line x1="1530" y1="371" x2="1560" y2="371" stroke="#45535e" stroke-width="1.7" /><polyline points="1552,366 1560,371 1552,376" fill="none" stroke="#45535e" stroke-width="1.7" /><rect x="520" y="155" width="210" height="85" fill="white" stroke="#69757e" stroke-width="1.5" /><text x="625" y="189" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#25313a" text-anchor="middle">External news corpus</text><text x="625" y="218" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#58656f" text-anchor="middle">Articles and their sentences</text><line x1="625" y1="240" x2="625" y2="290" stroke="#45535e" stroke-width="1.7" /><polyline points="620,282 625,290 630,282" fill="none" stroke="#45535e" stroke-width="1.7" /><text x="915" y="478" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#35556b" text-anchor="middle">Direct · Partial/contextual · Non-supporting</text><text x="40" y="546" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#25313a" text-anchor="start">What HVER-News measures</text><text x="40" y="579" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#25313a" text-anchor="start">Whether sentences supporting the specified actor, value and direction rank above merely topical or non-supporting sentences.</text></svg>