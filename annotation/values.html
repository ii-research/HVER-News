    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f8f9fa; margin: 20px; }
        h1 { color: #333; }
        .container { width: 90%; margin: auto; }

        /* Back-button styling */
        .back-btn {
            margin: 10px; padding: 10px 15px;
            background: #65A565FF; color: white;
            border: none; cursor: pointer;
            font-size: 16px; border-radius: 5px;
            position: absolute; left: 20px;
        }

        /* Search field */
        #searchBox {
            width: 50%; padding: 10px; margin: 10px;
            border: 1px solid #ccc; border-radius: 5px;
        }

        /* Outer card */
        .value-card {
            background: #65A565FF; color: white;
            padding: 10px; margin: 5px;
            cursor: pointer; border-radius: 5px;
            text-align: center; width: 30%;
            display: inline-block;
        }

        .value-head{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
        }
        .value-name{
            font-weight:700;
        }
        .copy-btn{
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.35);
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            flex: 0 0 auto;
        }
        .copy-btn:hover{ background: rgba(255,255,255,0.28); }
        .copy-btn:active{ transform: translateY(1px); }

        /* Detail-view styling */
        .details {
            display: none;
            background: #e9ecef; color: #333;
            padding: 10px; margin-top: 5px;
            border-radius: 5px; text-align: left;
        }
        .details-head{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            margin-bottom: 6px;
        }
        .copy-all-btn{
            background: #ffffff;
            border: 1px solid #d1d5db;
            color: #111827;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            user-select: none;
            flex: 0 0 auto;
        }
        .copy-all-btn:hover{ background: #f3f4f6; }
        .copy-all-btn:active{ transform: translateY(1px); }

        .top-actions{
            width: 90%;
            margin: 0 auto 10px auto;
            display:flex;
            justify-content:center;
            gap:10px;
            flex-wrap:wrap;
        }
        .copy-page-btn{
            background: #65A565FF;
            border: 1px solid #4f8f4f;
            color: #fff;
            font-size: 14px;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            user-select: none;
        }
        .copy-page-btn:hover{ filter: brightness(0.95); }
        .copy-page-btn:active{ transform: translateY(1px); }

        .toast{
            position: fixed;
            left: 50%;
            top: 18px;
            transform: translateX(-50%);
            background: rgba(17,24,39,0.92);
            color: #fff;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 13px;
            display: none;
            z-index: 9999;
            max-width: 92vw;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        let toastTimer = null;
        function showToast(text){
            const el = document.getElementById('toast');
            if(!el) return;
            el.textContent = text;
            el.style.display = 'block';
            if(toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { el.style.display = 'none'; }, 1200);
        }

        async function copyText(text){
            const t = String(text || '').trim();
            if(!t) return false;
            try{
                if(navigator.clipboard && navigator.clipboard.writeText){
                    await navigator.clipboard.writeText(t);
                    return true;
                }
            }catch(e){}
            try{
                const ta = document.createElement('textarea');
                ta.value = t;
                ta.setAttribute('readonly','');
                ta.style.position = 'fixed';
                ta.style.left = '-9999px';
                document.body.appendChild(ta);
                ta.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return !!ok;
            }catch(e){
                return false;
            }
        }

        function buildFullText(value){
            const v = value || {};
            const level3 = Array.isArray(v.level3) ? v.level3.join(", ") : String(v.level3 || "");
            const level4a = Array.isArray(v.level4a) ? v.level4a.join(", ") : String(v.level4a || "");
            const level4b = Array.isArray(v.level4b) ? v.level4b.join(", ") : String(v.level4b || "");
            const desc = Array.isArray(v.descriptions) ? v.descriptions.join("; ") : String(v.descriptions || "");
            return [
                String(v.name || "").trim(),
                "",
                `Alternative Name: ${String(v.alternativeName || "")}`,
                `ID: ${String(v.id || "")}`,
                `Level2: ${String(v.level2 || "")}`,
                `Level3: ${level3}`,
                `Level4a: ${level4a}`,
                `Level4b: ${level4b}`,
                `Descriptions: ${desc}`
            ].join("\n").trim();
        }

        function buildAllValuesText(){
            const blocks = [];
            humanValues.forEach((v, idx) => {
                blocks.push(`# ${idx+1}. ${String(v.name || "").trim()}`);
                blocks.push(buildFullText(v));
            });
            return blocks.join("\n\n---\n\n").trim();
        }

        function renderValues() {
            const container = document.getElementById("valuesContainer");
            container.innerHTML = "";

            humanValues.forEach(value => {
                let detailsHTML = `
                    <div class="details" id="details-${value.id}">
                        <div class="details-head">
                            <div style="font-weight:700">Details</div>
                            <button class="copy-all-btn" type="button" data-copy-all="1" title="Copy all details">Copy all</button>
                        </div>
                        <strong>Alternative Name:</strong> ${value.alternativeName}<br>
                        <strong>Level2:</strong> ${value.level2}<br>
                        <strong>Level3:</strong> ${value.level3.join(", ")}<br>
                        <strong>Level4a:</strong> ${value.level4a.join(", ")}<br>
                        <strong>Level4b:</strong> ${value.level4b.join(", ")}<br>
                        <strong>Descriptions:</strong> ${value.descriptions.join("; ")}
                    </div>
                `;

                let card = document.createElement("div");
                card.className = "value-card";
                card.innerHTML =
                    `<div class="value-head">` +
                    `<div class="value-name">${value.name}</div>` +
                    `<button class="copy-btn" type="button" title="Copy this value">Copy</button>` +
                    `</div>` +
                    detailsHTML;
                card.onclick = function() {
                    let details = document.getElementById(`details-${value.id}`);
                    details.style.display = (details.style.display === "none" || details.style.display === "") ? "block" : "none";
                };
                const copyBtn = card.querySelector('.copy-btn');
                if(copyBtn){
                    copyBtn.addEventListener('click', async (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        const ok = await copyText(value.name);
                        showToast(ok ? `Copied: ${value.name}` : 'Copy failed');
                    });
                }
                const copyAllBtn = card.querySelector('[data-copy-all]');
                if(copyAllBtn){
                    copyAllBtn.addEventListener('click', async (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                        const ok = await copyText(buildFullText(value));
                        showToast(ok ? 'Copied all details' : 'Copy failed');
                    });
                }

                container.appendChild(card);
            });
        }

        function filterValues() {
            let searchInput = document.getElementById("searchBox").value.toLowerCase();
            let cards = document.getElementsByClassName("value-card");

            Array.from(cards).forEach(card => {
                let text = card.innerText.toLowerCase();
                card.style.display = text.includes(searchInput) ? "inline-block" : "none";
            });
        }

        renderValues();

        const copyAllBtn = document.getElementById('copyAllValuesBtn');
        if(copyAllBtn){
            copyAllBtn.addEventListener('click', async () => {
                const ok = await copyText(buildAllValuesText());
                showToast(ok ? 'Copied all values' : 'Copy failed');
            });
        }
    </script>
